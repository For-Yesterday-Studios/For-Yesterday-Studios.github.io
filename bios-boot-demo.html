<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIOS Boot Demo</title><style>.boot-screen{position:fixed;inset:0;z-index:9999;background:#030504;color:#d8ded9;font-family:Consolas,"Courier New",monospace;overflow:hidden;transition:opacity .65s,visibility .65s}.boot-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}.boot-screen:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;background:repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 4px)}.boot-wrap{width:min(960px,calc(100% - 36px));height:100%;margin:auto;display:flex;flex-direction:column;padding:clamp(25px,5vh,55px) 0 25px}.boot-brand{display:flex;align-items:center;gap:22px;padding-bottom:24px;border-bottom:1px solid #344037}.boot-logo{width:clamp(76px,11vw,120px);height:clamp(76px,11vw,120px);object-fit:contain}.boot-fallback{width:100px;height:100px;display:none;place-items:center;border:2px solid #d8ded9;font-size:28px;font-weight:bold}.boot-title{font-size:clamp(20px,4vw,39px);font-weight:bold;color:#f1f4f1}.boot-subtitle{margin-top:8px;color:#8b968d;font-size:12px;letter-spacing:2px}.boot-version{margin-top:7px;color:#5f6b61;font-size:11px}.boot-output{flex:1;padding:25px 0 15px;font-size:clamp(11px,1.7vw,15px);line-height:1.7;overflow:hidden}.boot-line{min-height:1.7em;opacity:0;transform:translateY(3px)}.boot-line.show{opacity:1;transform:none}.ok{color:#42ff8b}.warn{color:#f2d36a}.dim{color:#748078}.white{color:#f1f4f1}.boot-bottom{padding-top:17px;border-top:1px solid #273029}.boot-label{display:flex;justify-content:space-between;margin-bottom:9px;font-size:11px;color:#89948c}.boot-track{height:14px;padding:2px;border:1px solid #829087;background:#080b09}.boot-bar{width:0;height:100%;background:#dce3dd;box-shadow:0 0 12px #dce3dd55;transition:width .3s linear}.boot-hint{margin-top:13px;color:#4f5a52;font-size:10px;text-align:right}#website-content{opacity:0;transition:opacity .7s}#website-content.ready{opacity:1}@media(max-width:600px){.boot-brand{align-items:flex-start}.boot-output{line-height:1.52}.boot-line{min-height:1.52em}.boot-hint{text-align:left}}
body{margin:0;background:#070809;color:#eee;font-family:Consolas,monospace}main{min-height:100vh;display:grid;place-items:center;text-align:center}</style></head><body><div id="boot-screen" class="boot-screen" role="status" aria-label="Uruchamianie strony"><div class="boot-wrap"><div class="boot-brand"><img class="boot-logo" src="logo.png" alt="Logo studia" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="boot-fallback">NBS</div><div><div class="boot-title">NULLBYTE STUDIOS</div><div class="boot-subtitle">CREATIVE SYSTEM BIOS</div><div class="boot-version">Build 2.6.09.12 / Copyright (C) 2026</div></div></div><div id="boot-output" class="boot-output"></div><div class="boot-bottom"><div class="boot-label"><span id="boot-stage">System initialization</span><span id="boot-percent">0%</span></div><div class="boot-track"><div id="boot-bar" class="boot-bar"></div></div><div class="boot-hint">Press ESC to skip startup sequence</div></div></div></div><div id="website-content"><main><div><h1>NULLBYTE STUDIOS</h1><p>Strona została uruchomiona.</p></div></main></div><script>const screen=document.querySelector("#boot-screen"),content=document.querySelector("#website-content"),output=document.querySelector("#boot-output"),bar=document.querySelector("#boot-bar"),percent=document.querySelector("#boot-percent"),stage=document.querySelector("#boot-stage");let finished=false;const lines=[
["NULLBYTE Creative BIOS v2.6","white",180],["Copyright (C) 2026 NULLBYTE STUDIOS","dim",220],["","",180],["Detecting creative processors .............. [ OK ]","ok",390],["Memory test: 65536 MB imagination .......... [ OK ]","ok",440],["Initializing rendering subsystem ........... [ OK ]","ok",420],["Mounting C:\\NBS\\games ..................... [ OK ]","ok",440],["Loading audio drivers ...................... [ OK ]","ok",390],["Checking sleep schedule .................... [ WARN ]","warn",470],["Coffee device detected on PORT_01","dim",330],["Network connection established.","dim",360],["","",180],["Starting studio interface...","white",490],["C:\\NBS> launch website.exe_","white",650]];
const wait=ms=>new Promise(r=>setTimeout(r,ms));function progress(v,s){bar.style.width=v+"%";percent.textContent=v+"%";stage.textContent=s}function finish(){if(finished)return;finished=true;progress(100,"Startup complete");content.classList.add("ready");setTimeout(()=>screen.classList.add("hidden"),180);setTimeout(()=>screen.remove(),950)}async function boot(){progress(4,"Power-on self-test");for(let i=0;i<lines.length&&!finished;i++){const [text,cls,delay]=lines[i],el=document.createElement("div");el.className="boot-line "+cls;el.textContent=text||" ";output.appendChild(el);requestAnimationFrame(()=>el.classList.add("show"));progress(Math.min(94,Math.round(5+(i+1)/lines.length*89)),i<3?"Power-on self-test":i<9?"Loading system components":i<12?"Checking devices":"Launching interface");await wait(delay)}if(!finished){await wait(180);finish()}}document.addEventListener("keydown",e=>{if(e.key==="Escape")finish()});boot();</script></body></html>
